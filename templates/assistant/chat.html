{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ-помощник юриста</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="app-header__title">
                <h1>ИИ-помощник юриста</h1>
                <p class="app-header__subtitle">Право Российской Федерации · справочная информация</p>
            </div>
            <button type="button" id="clear-btn" class="btn--ghost" hidden>Очистить</button>
        </header>

        <div class="stage">
            <div class="chat__empty" id="empty-state">
                <p>Привет, Евгений! Какие дела?</p>
                <p class="chat__hint">Опишите вашу правовую ситуацию, задайте вопрос
                    или приложите документ — договор, расчётный листок, скан постановления.</p>
            </div>

            <main class="chat" id="chat" hidden></main>

            <button type="button" class="scroll-down" id="scroll-down" hidden aria-label="К концу диалога">↓</button>
        </div>

        <form class="composer" id="composer">
            <!-- Выбранные файлы показываются над строкой ввода и удаляются по клику. -->
            <div class="attachments" id="attachments" hidden></div>
            <p class="composer__notice" id="upload-notice" hidden></p>

            <div class="composer__row">
                <input type="file" id="file-input" class="visually-hidden" multiple
                       accept=".pdf,.docx,.txt,.md,.rtf,.csv,.json,.html,.htm,.xml,.log,.png,.jpg,.jpeg,.gif,.bmp,.webp,.tiff">
                <button type="button" class="composer__clip" id="clip-btn"
                        title="Прикрепить документ или фото" aria-label="Прикрепить документ">📎</button>
                <textarea name="message" class="composer__input" id="input" rows="1"
                          placeholder="Спросите о праве..." autocomplete="off"></textarea>
                <button type="submit" class="btn--primary" id="send-btn"
                        title="Отправить" aria-label="Отправить">➤</button>
            </div>
        </form>
    </div>

    <!-- Старая переписка приходит с сервера и рисуется тем же кодом, что и новые сообщения. -->
    <script id="initial-history" type="application/json">{{ history_json|safe }}</script>
    <script id="ocr-ready" type="application/json">{{ ocr_ready|yesno:"true,false" }}</script>

    <script src="{% static 'js/chat.js' %}"></script>
</body>
</html>
